<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white p-6 min-h-screen">

     <div class="max-w-3xl mx-auto space-y-8">
        
        <!-- 3. form -->
        <section class="bg-[#071A3D] p-6 rounded-lg shadow-md">
            <h1 class="text-3xl font-bold text-yellow-600 text-center">Stuedent Creativity Festival</h1>
            <p class="text-pink-100 mt-2 text-center">prove that you deserve to be a champion!</p>
        <br>
         </div>
         <br>
         <div class="max-w-3xl mx-auto space-y-8">
             <section class="bg-yellow-100 p-6 rounded-lg shadow-md">
            <h1 class="text-3xl font-bold text-[#071A3D] text-center">Registration Now!</h1>
            <p class="text-yellow-500 mt-2 text-center">Make sure the information you enter is correct</p>
            <br>
            <br>
            <form class="space-y-4">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text gray-700 mb-1">Enter your name</label>
                        <input type="text" placeholder="full name" class="w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">

                    </div>
            
                        <div>

                          <label class="block text-sm font-medium text-gray-700 mb-1">Class</label>
                          <select class="w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 invalid:text-gray-400">

                         <option value="" disabled selected class="text-gray-400">choose your class</option>
                              <option value="web" class="text-gray-800">X</option>
                              <option value="uiux" class="text-gray-800">XI</option>
                              <option value="uiux" class="text-gray-800">XII</option>
                              </select>
                </div>

        
                    <div>
                         <label class="block text-sm font-medium text-gray-700 mb-1">Jenis Kelamin</label>
                         <div class="flex gap-4">
                        <label class="flex items-center gap-1">
                            <input type="radio" name="gender" value="L"> Laki-laki
                        </label>
                        <label class="flex items-center gap-1">
                            <input type="radio" name="gender" value="P"> Perempuan
                        </label>
                     </div>
                         <br>
              <div>
                     <label class="block text-sm font-medium text-gray-700 mb-1">Competition Category</label>
                          <select class="w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 invalid:text-gray-400">

                          <option value="" disabled selected class="text-gray-400">Choose your competition!</option>
                              <option value="web" class="text-gray-800">Web development</option>
                              <option value="uiux" class="text-gray-800">IoT project</option>
                              <option value="uiux" class="text-gray-800">Graphic Desain</option>
                              <option value="uiux" class="text-gray-800">Public Speaking</option>
                             <option value="uiux" class="text-gray-800">Photography</option>
                        </select>

                    
                        <label class="block text-sm font-medium text-gray-700 mb-1">Team name</label>
                        <input type="text" placeholder="enter your team name" class="w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                     <div>
                      <label class="block text-sm font-medium text-gray-700 mb-1">Nomor Telepon</label>
                      <input type="tel" placeholder="08123456789" class="w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                      </div>
                </div>

            



            </form>

           


         
         </div>



         </div>





    
</body>
</html>
